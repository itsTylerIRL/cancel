# /etc/nginx/sites-available/cancel-api  (certbot adds the TLS lines)
limit_req_zone $binary_remote_addr zone=cancelapi:5m rate=5r/s;

server {
    listen 80;
    server_name cancel-api.tylerirl.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }
    location /api/ {
        limit_req zone=cancelapi burst=20 nodelay;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }
    location /r/ {  # share links: a preview page for robots, a forward to the game for people
        limit_req zone=cancelapi burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }
    location / { return 404; }
}
